# NGINX Reverse-Proxy Configuration for goboxd with Mandatory mTLS
# Listening on TCP 8443 (Private VPC Subnet only)
# Forwards to loopback http://127.0.0.1:8081

# Custom log format that omits Authorization headers, source code, and payload tokens
log_format secure_goboxd '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" rt=$request_time';

server {
    listen 8443 ssl;
    server_name goboxd.internal localhost 127.0.0.1;

    access_log /var/log/nginx/goboxd_access.log secure_goboxd;
    error_log  /var/log/nginx/goboxd_error.log warn;

    # Server TLS Certificates
    ssl_certificate         /etc/ssl/certs/goboxd-server.crt;
    ssl_certificate_key     /etc/ssl/private/goboxd-server.key;

    # Client-Side Certificate Authentication (mTLS)
    ssl_client_certificate  /etc/ssl/certs/lara-internal-ca.crt;
    ssl_verify_client       on;
    ssl_verify_depth        2;

    # Modern TLS Security Hardening
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout     1d;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_tickets     off;

    # Proxy Limits and Buffers
    client_max_body_size    2M;
    client_body_buffer_size 2M;

    # Proxy to goboxd loopback listener
    location / {
        proxy_pass http://127.0.0.1:8081;

        # Forward required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Verify $ssl_client_verify;

        # Pass through Bearer token in Authorization header
        proxy_pass_header Authorization;

        # Bounded execution timeouts (matching goboxd 120s limit)
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Disable buffering for low-latency streaming of responses
        proxy_buffering off;
    }
}
