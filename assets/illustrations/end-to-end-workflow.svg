<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">LARA End-to-End Runtime Workflow</title><desc id="desc">Request to verified deliverable through classification, planning, context, execution, verification and approval.</desc><rect width="1200" height="720" rx="28" fill="#F5FFE8"/><text x="56" y="62" font-family="Arial" font-size="30" font-weight="800" fill="#101014">ONE REQUEST. A GOVERNED EXECUTION TRACE.</text><text x="58" y="94" font-family="Arial" font-size="17" fill="#66666F">The runtime creates a task-scoped environment with only the data, tools and permissions required.</text><rect x="55" y="205" width="150" height="128" rx="20" fill="#DDF5FF"/><text x="77" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#101014">REQUEST</text><text x="77" y="301" font-family="Arial, sans-serif" font-size="15" fill="#66666F">User task + files</text><rect x="245" y="205" width="150" height="128" rx="20" fill="#C7B9FF"/><text x="267" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#101014">CLASSIFY</text><text x="267" y="301" font-family="Arial, sans-serif" font-size="15" fill="#66666F">Role + data labels</text><rect x="435" y="205" width="150" height="128" rx="20" fill="#EEE8FF"/><text x="457" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#101014">PLAN</text><text x="457" y="301" font-family="Arial, sans-serif" font-size="15" fill="#66666F">Plan + agents</text><rect x="625" y="205" width="150" height="128" rx="20" fill="#E4FF88"/><text x="647" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#101014">ROUTE</text><text x="647" y="301" font-family="Arial, sans-serif" font-size="15" fill="#66666F">Route + context</text><rect x="815" y="205" width="150" height="128" rx="20" fill="#FFE3D5"/><text x="837" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#101014">EXECUTE</text><text x="837" y="301" font-family="Arial, sans-serif" font-size="15" fill="#66666F">Tools + sandbox</text><rect x="1005" y="205" width="150" height="128" rx="20" fill="#FFE0F8"/><text x="1027" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#101014">VERIFY</text><text x="1027" y="301" font-family="Arial, sans-serif" font-size="15" fill="#66666F">Evidence + checks</text><path d="M208 270H233" stroke="#101014" stroke-width="4"/><path d="M222 261L233 270L222 279" fill="none" stroke="#101014" stroke-width="4"/><path d="M398 270H423" stroke="#101014" stroke-width="4"/><path d="M412 261L423 270L412 279" fill="none" stroke="#101014" stroke-width="4"/><path d="M588 270H613" stroke="#101014" stroke-width="4"/><path d="M602 261L613 270L602 279" fill="none" stroke="#101014" stroke-width="4"/><path d="M778 270H803" stroke="#101014" stroke-width="4"/><path d="M792 261L803 270L792 279" fill="none" stroke="#101014" stroke-width="4"/><path d="M968 270H993" stroke="#101014" stroke-width="4"/><path d="M982 261L993 270L982 279" fill="none" stroke="#101014" stroke-width="4"/><rect x="55" y="390" width="1100" height="100" rx="18" fill="#EC00D4"/><text x="82" y="428" font-family="Arial" font-size="20" font-weight="800" fill="#101014">POLICY ENFORCED AT EVERY STEP</text><text x="82" y="460" font-family="Arial" font-size="17" fill="#101014">Identity • RBAC / ABAC • data classification • purpose • tool permissions • approval rules • audit</text><path d="M130 333V390M320 333V390M510 333V390M700 333V390M890 333V390M1080 333V390" stroke="#4B43F5" stroke-width="4"/><rect x="175" y="545" width="330" height="95" rx="20" fill="#23C978"/><text x="197" y="588" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">DELIVER</text><text x="197" y="619" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Verified result + evidence bundle</text><rect x="695" y="545" width="330" height="95" rx="20" fill="#101014"/><text x="717" y="588" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">CLOSE ENVIRONMENT</text><text x="717" y="619" font-family="Arial, sans-serif" font-size="17" fill="#D7D7DF">Revoke access • preserve trace</text><path d="M1080 490V520H340V545M505 592H695" fill="none" stroke="#101014" stroke-width="5"/><path d="M680 580L695 592L680 604" fill="none" stroke="#101014" stroke-width="5"/><text x="55" y="685" font-family="Arial" font-size="15" fill="#66666F">Consequential actions pause for human review. Environment resources are removed after task completion.</text></svg>
