<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Institutional Knowledge Fabric</title><desc id="desc">Multi-representation knowledge flow combining documents, images, structured records and graph relations.</desc><rect width="1200" height="650" rx="28" fill="#F5FFE8"/><text x="56" y="62" font-family="Arial" font-size="30" font-weight="800" fill="#101014">INSTITUTIONAL KNOWLEDGE FABRIC</text><text x="58" y="94" font-family="Arial" font-size="17" fill="#66666F">Not vector search alone: multiple representations, provenance and permission-aware context.</text><rect x="70" y="180" width="220" height="110" rx="20" fill="#DDF5FF"/><text x="92" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">DOCUMENTS</text><text x="92" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">PDF • SOP • reports</text><rect x="355" y="180" width="220" height="110" rx="20" fill="#EEE8FF"/><text x="377" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">MULTIMODAL</text><text x="377" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Images • drawings • OCR</text><rect x="640" y="180" width="220" height="110" rx="20" fill="#E4FF88"/><text x="662" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">STRUCTURED</text><text x="662" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">SQL • spreadsheets</text><rect x="925" y="180" width="220" height="110" rx="20" fill="#FFE3D5"/><text x="947" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">RELATIONSHIPS</text><text x="947" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Graph • entities • lineage</text><path d="M290 235H345" stroke="#00B9E8" stroke-width="6"/><path d="M330 223L345 235L330 247" fill="none" stroke="#00B9E8" stroke-width="5"/><path d="M575 235H630" stroke="#00B9E8" stroke-width="6"/><path d="M615 223L630 235L615 247" fill="none" stroke="#00B9E8" stroke-width="5"/><path d="M860 235H915" stroke="#00B9E8" stroke-width="6"/><path d="M900 223L915 235L900 247" fill="none" stroke="#00B9E8" stroke-width="5"/><rect x="270" y="390" width="660" height="125" rx="20" fill="#101014"/><text x="292" y="433" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">CONTEXT ASSEMBLY</text><text x="292" y="464" font-family="Arial, sans-serif" font-size="17" fill="#D7D7DF">RAG • GraphRAG • CAG • SQL • source versions • access filtering</text><path d="M180 290V340H600V390M465 290V340M750 290V340M1035 290V340H600" fill="none" stroke="#4B43F5" stroke-width="4"/><rect x="320" y="555" width="560" height="60" rx="16" fill="#23C978"/><text x="600" y="592" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#101014">PROVENANCE-LINKED TASK CONTEXT</text></svg>
