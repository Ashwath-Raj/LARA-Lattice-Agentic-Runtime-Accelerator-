<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Dynamic Information Highways</title><desc id="desc">A permission-aware graph connecting enterprise sources, specialist agents, skills and tools.</desc><rect width="1200" height="720" rx="28" fill="#F5FFE8"/><text x="56" y="62" font-family="Arial" font-size="30" font-weight="800" fill="#101014">DYNAMIC INFORMATION HIGHWAYS</text><text x="58" y="94" font-family="Arial" font-size="17" fill="#66666F">Resolve routes per task, identity and context — not one fixed retrieval chain.</text><path d="M235 250C340 250 330 175 430 175S540 250 650 250S820 180 925 180" fill="none" stroke="#00B9E8" stroke-width="12" stroke-linecap="round"/><path d="M235 430C340 430 330 500 430 500S540 430 650 430S820 500 925 500" fill="none" stroke="#EC00D4" stroke-width="10" stroke-dasharray="18 14" stroke-linecap="round"/><path d="M235 250C360 250 345 350 470 350H780" fill="none" stroke="#4B43F5" stroke-width="10" stroke-linecap="round"/><rect x="48" y="205" width="190" height="92" rx="20" fill="#23C978"/><text x="70" y="248" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">SOP REPOSITORY</text><text x="70" y="279" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Approved procedures</text><rect x="48" y="385" width="190" height="92" rx="20" fill="#C7B9FF"/><text x="70" y="428" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">ASSET RECORDS</text><text x="70" y="459" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Structured history</text><rect x="395" y="130" width="210" height="92" rx="20" fill="#DDF5FF"/><text x="417" y="173" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">RESEARCH AGENT</text><text x="417" y="204" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Evidence discovery</text><rect x="395" y="305" width="210" height="92" rx="20" fill="#EEE8FF"/><text x="417" y="348" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">ANALYSIS AGENT</text><text x="417" y="379" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Reasoning and synthesis</text><rect x="395" y="455" width="210" height="92" rx="20" fill="#FFE3D5"/><text x="417" y="498" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">VERIFIER AGENT</text><text x="417" y="529" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Evidence and checks</text><rect x="650" y="205" width="210" height="92" rx="20" fill="#E4FF88"/><text x="672" y="248" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">SKILL REGISTRY</text><text x="672" y="279" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Reusable capabilities</text><rect x="650" y="385" width="210" height="92" rx="20" fill="#FFE0F8"/><text x="672" y="428" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">TOOL GATEWAY</text><text x="672" y="459" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Scoped operations</text><rect x="930" y="130" width="220" height="92" rx="20" fill="#FFFFFF" stroke="#101014" stroke-width="3"/><text x="952" y="173" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">TASK CONTEXT</text><text x="952" y="204" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Intent + identity</text><rect x="930" y="455" width="220" height="92" rx="20" fill="#FFFFFF" stroke="#101014" stroke-width="3"/><text x="952" y="498" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">VERIFIED OUTPUT</text><text x="952" y="529" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Trace + provenance</text><path d="M860 251H920" stroke="#101014" stroke-width="5"/><path d="M905 238L920 251L905 264" fill="none" stroke="#101014" stroke-width="5"/><rect x="915" y="305" width="245" height="82" rx="16" fill="#101014"/><text x="937" y="337" font-family="Arial" font-size="18" font-weight="700" fill="#FFFFFF">POLICY FILTER</text><text x="937" y="362" font-family="Arial" font-size="14" fill="#FFFFFF">Identity • purpose • classification</text><text x="58" y="625" font-family="Arial" font-size="16" font-weight="700" fill="#4B43F5">ROUTES ARE FILTERED BEFORE PROTECTED DATA IS READ</text><text x="58" y="657" font-family="Arial" font-size="15" fill="#66666F">Illustrative graph: route edges are selected and authorised by the runtime.</text></svg>
