<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Task-Scoped Execution Environment</title><desc id="desc">A temporary execution environment receives just-enough data, approved tools and constrained compute, then closes.</desc><rect width="1200" height="720" rx="28" fill="#F5FFE8"/><text x="56" y="62" font-family="Arial" font-size="30" font-weight="800" fill="#101014">TASK-SCOPED EXECUTION ENVIRONMENT</text><text x="58" y="94" font-family="Arial" font-size="17" fill="#66666F">Just enough data. Just-in-time tools. Approved models. Bounded compute.</text><rect x="70" y="195" width="230" height="120" rx="20" fill="#DDF5FF"/><text x="92" y="238" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">TASK REQUEST</text><text x="92" y="269" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Identity • task • purpose</text><rect x="355" y="165" width="490" height="190" rx="20" fill="#DDF8E8"/><text x="377" y="208" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">EPHEMERAL WORKSPACE</text><rect x="900" y="195" width="230" height="120" rx="20" fill="#FFE3D5"/><text x="922" y="238" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">VERIFIED OUTPUT</text><text x="922" y="269" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Evidence • trace • result</text><rect x="390" y="230" width="190" height="88" rx="20" fill="#EEE8FF"/><text x="412" y="273" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">DATA</text><text x="412" y="304" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Relevant sources only</text><rect x="605" y="230" width="190" height="88" rx="20" fill="#FFE3D5"/><text x="627" y="273" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">TOOLS</text><text x="627" y="304" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Approved, scoped</text><path d="M300 255H355M845 255H900" stroke="#101014" stroke-width="5"/><path d="M340 243L355 255L340 267M885 243L900 255L885 267" fill="none" stroke="#101014" stroke-width="5"/><rect x="355" y="405" width="490" height="92" rx="18" fill="#EC00D4"/><text x="385" y="443" font-family="Arial" font-size="20" font-weight="800" fill="#101014">POLICY AT EVERY BOUNDARY</text><text x="385" y="472" font-family="Arial" font-size="16" fill="#101014">RBAC / ABAC • classification • network • resource quotas</text><path d="M600 355V405" stroke="#4B43F5" stroke-width="5"/><rect x="355" y="545" width="490" height="80" rx="20" fill="#101014"/><text x="377" y="588" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">CLOSE &amp; REVOKE</text><text x="377" y="619" font-family="Arial, sans-serif" font-size="17" fill="#D7D7DF">Destroy temporary files • revoke grants • preserve audit</text><path d="M1015 315V505H845V585" fill="none" stroke="#23C978" stroke-width="4"/><text x="70" y="675" font-family="Arial" font-size="15" fill="#66666F">No standing superuser access. No persistent task credentials. No physical equipment actuation in the MVP.</text></svg>
