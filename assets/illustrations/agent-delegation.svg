<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Agent Delegation and Context Flow</title><desc id="desc">The orchestrator delegates scoped subtasks to specialist agents with task context, identity and permission constraints.</desc><rect width="1200" height="720" rx="28" fill="#F5FFE8"/><text x="56" y="62" font-family="Arial" font-size="30" font-weight="800" fill="#101014">AGENT DELEGATION &amp; CONTEXT FLOW</text><text x="58" y="94" font-family="Arial" font-size="17" fill="#66666F">Delegation carries authority, purpose, context and a bounded task contract.</text><rect x="430" y="145" width="340" height="95" rx="20" fill="#DDF5FF"/><text x="452" y="188" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">ORCHESTRATOR</text><text x="452" y="219" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Plan • decompose • assign</text><rect x="70" y="355" width="290" height="110" rx="20" fill="#EEE8FF"/><text x="92" y="398" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">RESEARCH AGENT</text><text x="92" y="429" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Evidence discovery • source refs</text><rect x="455" y="355" width="290" height="110" rx="20" fill="#FFE3D5"/><text x="477" y="398" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">ANALYSIS AGENT</text><text x="477" y="429" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Reasoning • synthesis • proposal</text><rect x="840" y="355" width="290" height="110" rx="20" fill="#DDF8E8"/><text x="862" y="398" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">VERIFICATION AGENT</text><text x="862" y="429" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Checks • consistency • evidence</text><path d="M600 240V290H215V355M600 290V355M600 290H985V355" fill="none" stroke="#00B9E8" stroke-width="6"/><rect x="180" y="520" width="840" height="100" rx="18" fill="#101014"/><text x="210" y="558" font-family="Arial" font-size="20" font-weight="800" fill="#FFFFFF">DELEGATION CONTRACT</text><text x="210" y="590" font-family="Arial" font-size="16" fill="#D7D7DF">Principal • purpose • permitted resources • task scope • expiry • output schema</text><path d="M215 465V490H600V520M600 465V520M985 465V490H600" fill="none" stroke="#8B4DFA" stroke-width="4"/><text x="58" y="675" font-family="Arial" font-size="15" fill="#66666F">Subagents receive scoped authority; every nested tool call is re-authorised at the gateway.</text></svg>
