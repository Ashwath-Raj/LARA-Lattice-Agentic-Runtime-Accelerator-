<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Institutional Memory Lifecycle</title><desc id="desc">Only validated, approved and permission-labelled outcomes become reusable institutional memory.</desc><rect width="1200" height="720" rx="28" fill="#F5FFE8"/><text x="56" y="62" font-family="Arial" font-size="30" font-weight="800" fill="#101014">TRACEABLE INSTITUTIONAL MEMORY</text><text x="58" y="94" font-family="Arial" font-size="17" fill="#66666F">Execution history compounds organisational capability without turning every response into truth.</text><rect x="65" y="220" width="215" height="125" rx="20" fill="#DDF5FF"/><text x="85" y="265" font-family="Arial" font-size="21" font-weight="800" fill="#101014">CAPTURE</text><text x="85" y="305" font-family="Arial" font-size="15" fill="#66666F">Trace • sources • feedback</text><rect x="350" y="220" width="215" height="125" rx="20" fill="#FFE3D5"/><text x="370" y="265" font-family="Arial" font-size="21" font-weight="800" fill="#101014">VALIDATE</text><text x="370" y="305" font-family="Arial" font-size="15" fill="#66666F">Evidence • reviewer • checks</text><rect x="635" y="220" width="215" height="125" rx="20" fill="#EEE8FF"/><text x="655" y="265" font-family="Arial" font-size="21" font-weight="800" fill="#101014">CLASSIFY</text><text x="655" y="305" font-family="Arial" font-size="15" fill="#66666F">Owner • tenant • retention</text><rect x="920" y="220" width="215" height="125" rx="20" fill="#DDF8E8"/><text x="940" y="265" font-family="Arial" font-size="21" font-weight="800" fill="#101014">REUSE</text><text x="940" y="305" font-family="Arial" font-size="15" fill="#66666F">Permitted future context</text><path d="M280 282H335" stroke="#00B9E8" stroke-width="5"/><path d="M320 270L335 282L320 294" fill="none" stroke="#00B9E8" stroke-width="5"/><path d="M565 282H620" stroke="#00B9E8" stroke-width="5"/><path d="M605 270L620 282L605 294" fill="none" stroke="#00B9E8" stroke-width="5"/><path d="M850 282H905" stroke="#00B9E8" stroke-width="5"/><path d="M890 270L905 282L890 294" fill="none" stroke="#00B9E8" stroke-width="5"/><rect x="180" y="430" width="840" height="105" rx="18" fill="#101014"/><text x="210" y="470" font-family="Arial" font-size="20" font-weight="800" fill="#FFFFFF">MEMORY GOVERNANCE</text><text x="210" y="505" font-family="Arial" font-size="16" fill="#D7D7DF">Provenance • access labels • retention • correction • expiry • deletion</text><path d="M1027 345V390H600V430" fill="none" stroke="#8B4DFA" stroke-width="5"/><text x="65" y="610" font-family="Arial" font-size="17" font-weight="700" fill="#4B43F5">UNVALIDATED OUTPUTS ARE NOT PROMOTED TO INSTITUTIONAL KNOWLEDGE.</text><text x="65" y="650" font-family="Arial" font-size="15" fill="#66666F">Memory is identity-aware and purpose-bound; agents cannot silently share unrestricted context.</text></svg>
