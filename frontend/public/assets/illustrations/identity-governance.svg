<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Identity-Aware Governance</title><desc id="desc">RBAC and ABAC evaluate principal, agent, resource, purpose and context before every protected operation.</desc><rect width="1200" height="720" rx="28" fill="#F5FFE8"/><text x="56" y="62" font-family="Arial" font-size="30" font-weight="800" fill="#101014">IDENTITY-AWARE GOVERNANCE</text><text x="58" y="94" font-family="Arial" font-size="17" fill="#66666F">Policy enforcement follows the user and every delegated agent.</text><rect x="65" y="180" width="220" height="116" rx="20" fill="#DDF5FF"/><text x="87" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">PRINCIPAL</text><text x="87" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">User + agent identity</text><rect x="355" y="180" width="220" height="116" rx="20" fill="#EEE8FF"/><text x="377" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">CONTEXT</text><text x="377" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Department • tenant • purpose</text><rect x="645" y="180" width="220" height="116" rx="20" fill="#FFE3D5"/><text x="667" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">RESOURCE</text><text x="667" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Data label • owner • scope</text><rect x="935" y="180" width="200" height="116" rx="20" fill="#E4FF88"/><text x="957" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">ACTION</text><text x="957" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Read • route • execute</text><path d="M285 238H355M575 238H645M865 238H935" stroke="#101014" stroke-width="5"/><rect x="355" y="375" width="490" height="110" rx="20" fill="#101014"/><text x="377" y="418" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">POLICY DECISION POINT</text><text x="377" y="449" font-family="Arial, sans-serif" font-size="17" fill="#D7D7DF">RBAC + ABAC • least privilege • fail closed</text><path d="M175 296V340H600V375" fill="none" stroke="#4B43F5" stroke-width="4"/><path d="M465 296V340H600V375" fill="none" stroke="#4B43F5" stroke-width="4"/><path d="M755 296V340H600V375" fill="none" stroke="#4B43F5" stroke-width="4"/><path d="M1035 296V340H600V375" fill="none" stroke="#4B43F5" stroke-width="4"/><rect x="70" y="545" width="300" height="100" rx="20" fill="#DDF8E8"/><text x="92" y="588" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">ALLOW</text><text x="92" y="619" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Execute within approved scope</text><rect x="450" y="545" width="300" height="100" rx="20" fill="#FFE0F8"/><text x="472" y="588" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">DENY</text><text x="472" y="619" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Block • record • alert</text><rect x="830" y="545" width="300" height="100" rx="20" fill="#FFE3D5"/><text x="852" y="588" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">REQUIRE APPROVAL</text><text x="852" y="619" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Pause for authorised reviewer</text><path d="M600 485V515H220V545M600 515V545M600 515H980V545" fill="none" stroke="#101014" stroke-width="4"/><text x="70" y="690" font-family="Arial" font-size="15" fill="#66666F">Enforce before retrieval, during graph traversal, at delegation and immediately before tool execution.</text></svg>
