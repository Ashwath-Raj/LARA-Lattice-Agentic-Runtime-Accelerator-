<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">LARA Runtime Architecture</title><desc id="desc">Layered architecture separating entry surfaces, control plane, adaptive runtime, information fabric and controlled execution.</desc><rect width="1200" height="720" rx="28" fill="#F5FFE8"/><text x="56" y="62" font-family="Arial" font-size="30" font-weight="800" fill="#101014">LARA RUNTIME ARCHITECTURE</text><text x="58" y="94" font-family="Arial" font-size="17" fill="#66666F">One runtime, explicit authority boundaries and modular execution planes.</text><rect x="75" y="145" width="1050" height="82" rx="18" fill="#DDF5FF"/><text x="100" y="178" font-family="Arial" font-size="21" font-weight="800" fill="#101014">SURFACES</text><text x="380" y="194" font-family="Arial" font-size="19" fill="#101014">Workbench • Runtime Console • API • Authority Board</text><rect x="75" y="250" width="1050" height="82" rx="18" fill="#FFE0F8"/><text x="100" y="283" font-family="Arial" font-size="21" font-weight="800" fill="#101014">CONTROL PLANE</text><text x="380" y="299" font-family="Arial" font-size="19" fill="#101014">Identity • RBAC / ABAC • classification • policy • approvals • audit</text><rect x="75" y="355" width="1050" height="82" rx="18" fill="#EEE8FF"/><text x="100" y="388" font-family="Arial" font-size="21" font-weight="800" fill="#101014">ADAPTIVE RUNTIME</text><text x="380" y="404" font-family="Arial" font-size="19" fill="#101014">Task intake • planner • agent registry • orchestration • evolution engine</text><rect x="75" y="460" width="1050" height="82" rx="18" fill="#E4FF88"/><text x="100" y="493" font-family="Arial" font-size="21" font-weight="800" fill="#101014">INFORMATION FABRIC</text><text x="380" y="509" font-family="Arial" font-size="19" fill="#101014">Dynamic highways • RAG / GraphRAG / CAG • SQL • memory • provenance</text><rect x="75" y="565" width="1050" height="82" rx="18" fill="#FFE3D5"/><text x="100" y="598" font-family="Arial" font-size="21" font-weight="800" fill="#101014">EXECUTION PLANE</text><text x="380" y="614" font-family="Arial" font-size="19" fill="#101014">Tool gateway • scoped connectors • sandbox • model adapters • verification</text><path d="M600 227V250M600 332V355M600 437V460M600 542V565" stroke="#4B43F5" stroke-width="5"/><text x="75" y="690" font-family="Arial" font-size="15" fill="#66666F">Cross-cutting: tenant isolation • observability • secrets • evaluation • versioning • rollback</text></svg>
