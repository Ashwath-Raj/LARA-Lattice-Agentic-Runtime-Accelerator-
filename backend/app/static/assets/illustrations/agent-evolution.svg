<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Controlled Agent Evolution</title><desc id="desc">Observe execution, propose improvements, evaluate in a sandbox, approve and promote a version.</desc><rect width="1200" height="720" rx="28" fill="#F5FFE8"/><text x="56" y="62" font-family="Arial" font-size="30" font-weight="800" fill="#101014">CONTROLLED AGENT EVOLUTION</text><text x="58" y="94" font-family="Arial" font-size="17" fill="#66666F">Observe → Propose → Evaluate → Approve → Promote → Monitor</text><rect x="70" y="180" width="220" height="120" rx="20" fill="#DDF5FF"/><text x="92" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">01  OBSERVE</text><text x="92" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Traces • failures • feedback</text><rect x="355" y="180" width="220" height="120" rx="20" fill="#EEE8FF"/><text x="377" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">02  PROPOSE</text><text x="377" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Prompt • skill • strategy</text><rect x="640" y="180" width="220" height="120" rx="20" fill="#FFE3D5"/><text x="662" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">03  EVALUATE</text><text x="662" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Benchmarks • regression</text><rect x="925" y="180" width="220" height="120" rx="20" fill="#FFE0F8"/><text x="947" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">04  APPROVE</text><text x="947" y="254" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Authorised reviewer</text><path d="M296 240H344" stroke="#101014" stroke-width="5"/><path d="M330 228L344 240L330 252" fill="none" stroke="#101014" stroke-width="5"/><path d="M581 240H629" stroke="#101014" stroke-width="5"/><path d="M615 228L629 240L615 252" fill="none" stroke="#101014" stroke-width="5"/><path d="M866 240H914" stroke="#101014" stroke-width="5"/><path d="M900 228L914 240L900 252" fill="none" stroke="#101014" stroke-width="5"/><rect x="410" y="410" width="280" height="120" rx="20" fill="#23C978"/><text x="432" y="453" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">05  PROMOTE</text><text x="432" y="484" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Versioned release • rollback</text><rect x="820" y="410" width="280" height="120" rx="20" fill="#C7B9FF"/><text x="842" y="453" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101014">06  MONITOR</text><text x="842" y="484" font-family="Arial, sans-serif" font-size="17" fill="#66666F">Outcome tracking • drift</text><path d="M1035 300V372H690V450" fill="none" stroke="#8B4DFA" stroke-width="7"/><path d="M690 410H820" stroke="#101014" stroke-width="5"/><path d="M805 398L820 410L805 422" fill="none" stroke="#101014" stroke-width="5"/><path d="M820 470H245V300" fill="none" stroke="#00B9E8" stroke-width="6" stroke-dasharray="12 12"/><path d="M232 315L245 300L258 315" fill="none" stroke="#00B9E8" stroke-width="5"/><rect x="70" y="570" width="1030" height="78" rx="18" fill="#101014"/><text x="98" y="602" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF">NON-NEGOTIABLE BOUNDARY</text><text x="98" y="628" font-family="Arial" font-size="16" fill="#FFFFFF">Evolution may change agent behaviour; it cannot alter the security constitution or grant privileges.</text></svg>
